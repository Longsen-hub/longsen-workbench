name: 🐛 Bug report
description: Report a bug to help us improve
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
  - type: input
    id: env
    attributes:
      label: Environment
      description: Browser / OS / device
